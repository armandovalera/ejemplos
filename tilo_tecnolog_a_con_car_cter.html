<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilo — Tecnología con carácter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Manrope:wght@500&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --bg-page: #e9e6da;
      --bg-hero: #f0eedf;
      --bg-glow: #e2dfc6;
      --text: #171918;
      --text-muted: #3d403c;
      --accent: #bd431f;
      --accent-hover: #a33616;
      --btn-bg: #21231f;
      --btn-text: #ffffff;
      --focus-ring: #bd431f;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      color: var(--text);
      background: var(--bg-page);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-page);
      color: var(--text);
      overflow-x: hidden;
    }

    main {
      display: block;
      width: 100%;
    }

    .hero {
      position: relative;
      margin: 20px;
      min-height: max(720px, calc(100svh - 40px));
      height: auto;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tilo {
      background: var(--bg-hero);
      color: var(--text);
    }

    .tilo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 75% 45%, var(--bg-glow), transparent 54%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header: Marca y navegación sencilla, sin líneas divisorias ni textos decorativos pequeños */
    .section-nav {
      position: relative;
      z-index: 4;
      padding: 28px 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .brand {
      font-family: 'Manrope', sans-serif;
      font-weight: 500;
      font-size: 44px;
      line-height: 1;
      letter-spacing: -0.07em;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-symbol {
      color: var(--accent);
      font-size: 0.72em;
      line-height: 1;
      display: inline-block;
      transform: translateY(-2px);
    }

    .section-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .section-links a {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.2;
      color: var(--text);
      text-decoration: none;
      opacity: 0.84;
      transition: opacity 0.2s ease, color 0.2s ease;
      padding: 8px 4px;
      border-radius: 8px;
    }

    .section-links a:hover {
      opacity: 1;
      color: var(--accent);
    }

    /* Botones con texto centrado, sin flechas, altura de 60-66 px y bordes redondeados */
    .header-action,
    .cta {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      height: 62px;
      min-height: 60px;
      max-height: 66px;
      padding: 0 34px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      pointer-events: auto;
      transition: background-color 0.22s ease, color 0.22s ease, transform 0.2s ease, box-shadow 0.22s ease;
      user-select: none;
      white-space: nowrap;
    }

    .header-action {
      font-size: 16px;
      background: rgba(23, 25, 24, 0.07);
      color: var(--text);
    }

    .header-action:hover {
      background: rgba(189, 67, 31, 0.14);
      color: var(--accent);
    }

    .cta {
      font-size: 18px;
      background: var(--btn-bg);
      color: var(--btn-text);
      box-shadow: 0 10px 26px rgba(23, 25, 24, 0.12);
    }

    .cta:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(189, 67, 31, 0.25);
    }

    .cta:active {
      transform: translateY(0);
    }

    /* Foco visible accesible */
    a:focus-visible,
    button:focus-visible,
    #visual:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 4px;
    }

    #visual:focus-visible {
      outline-offset: -6px;
      border-radius: 12px;
    }

    /* Contenido editorial a la izquierda */
    .hero-body {
      position: relative;
      z-index: 3;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 24px 0 64px;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      margin: 0 0 0 7%;
      max-width: 610px;
      pointer-events: none;
    }

    .tilo h1 {
      font-family: 'Manrope', sans-serif;
      font-weight: 500;
      font-size: clamp(76px, 8.2vw, 140px);
      line-height: 0.91;
      letter-spacing: -0.07em;
      margin: 0;
      color: var(--text);
    }

    .tilo h1 em {
      font-family: 'Manrope', sans-serif;
      font-weight: 500;
      font-style: normal;
      color: var(--accent);
    }

    /* Subtítulo de 21-26 px en escritorio y 20 px móvil */
    .bodycopy {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(21px, 1.85vw, 26px);
      line-height: 1.38;
      letter-spacing: -0.01em;
      color: var(--text-muted);
      margin: 28px 0 34px;
      max-width: 24ch;
    }

    #response {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 15px;
      line-height: 1.4;
      min-height: 22px;
      margin: 18px 0 0;
      color: var(--accent);
      transition: opacity 0.25s ease;
    }

    /* Contenedor visual derecha con robot procedural grande */
    .visual {
      position: absolute;
      inset: 84px 0 24px 41%;
      z-index: 2;
      touch-action: pan-y;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .visual:active {
      cursor: grabbing;
    }

    .visual > .canvas-mount,
    .canvas-mount canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Colores vivos del demo */
    .tilo .canvas-mount canvas,
    .canvas-mount canvas {
      filter: saturate(1.28) contrast(1.045);
    }

    .fallback-art {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(120px, 18vw, 220px);
      color: rgba(189, 67, 31, 0.16);
      user-select: none;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .webgl-ready .fallback-art {
      opacity: 0;
    }

    #metrics {
      font-family: monospace;
      font-size: 10px;
    }

    /* Pantallas bajas: permite que la hero crezca sin recortar texto ni personaje */
    @media (max-height: 760px) and (min-width: 961px) {
      .hero {
        min-height: 720px;
        height: auto;
      }
      .hero-body {
        padding: 20px 0 48px;
      }
    }

    /* Composiciones laterales y tablet: apila texto y personaje sin tapar el título */
    @media (max-width: 960px) {
      .hero {
        margin: 14px;
        min-height: calc(100svh - 28px);
        height: auto;
        justify-content: flex-start;
      }

      .section-nav {
        padding: 22px 28px;
      }

      .hero-body {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 28px 0;
        flex: 0 0 auto;
      }

      .hero-content {
        margin: 12px 0 0;
        max-width: 100%;
      }

      .visual {
        position: relative;
        inset: auto;
        width: 100%;
        height: clamp(420px, 56svh, 620px);
        min-height: 420px;
        margin-top: 8px;
      }
    }

    /* Móvil */
    @media (max-width: 700px) {
      .hero {
        margin: 10px;
        min-height: calc(100svh - 20px);
        height: auto;
      }

      .section-nav {
        padding: 18px 20px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .brand {
        font-size: 36px;
      }

      .section-links {
        gap: 18px;
      }

      .section-links a {
        font-size: 15px;
      }

      .header-action {
        height: 60px;
        padding: 0 22px;
        font-size: 15px;
      }

      .hero-body {
        padding: 12px 22px 0;
      }

      .hero-content {
        margin: 10px 0 0;
        max-width: 100%;
      }

      .tilo h1 {
        font-size: clamp(58px, 14vw, 96px);
        letter-spacing: -0.06em;
      }

      .bodycopy {
        font-size: 20px;
        line-height: 1.4;
        margin: 20px 0 26px;
      }

      .cta {
        height: 62px;
        padding: 0 32px;
        font-size: 17px;
      }

      .visual {
        position: relative;
        inset: auto;
        width: 100%;
        height: clamp(390px, 52svh, 520px);
        min-height: 390px;
        margin-top: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero tilo" aria-label="Tilo">
      <header class="section-nav">
        <a class="brand" href="#hero-title">
          <span class="brand-symbol" aria-hidden="true">✳</span>tilo
        </a>
        <nav class="section-links" aria-label="Navegación de tilo">
          <a href="#hero-title" id="nav-concepto">Concepto</a>
          <a href="#visual" id="nav-experiencia">Experiencia</a>
        </nav>
        <a class="header-action" href="#action" id="nav-descubrir">Descubrir</a>
      </header>

      <div class="hero-body">
        <div class="hero-content">
          <h1 id="hero-title">Tecnología<br />con <em>carácter.</em></h1>
          <p class="bodycopy">Una nueva forma de conectar.</p>
          <button class="cta" id="action" type="button">Dile hola</button>
          <p id="response" aria-live="polite"></p>
        </div>
      </div>

      <div
        class="visual canvas-mount"
        id="visual"
        tabindex="0"
        role="group"
        aria-label="Robot interactivo Tilo. Mueve el cursor o usa las flechas del teclado para dirigir su mirada, y presiona Enter o Espacio para saludar."
      >
        <div class="fallback-art" aria-hidden="true">✳</div>
        <div class="canvas-mount"></div>
      </div>
    </section>
    <span id="metrics" hidden>WebGL activo · Three.js 0.186.0</span>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    /**
     * Construye el personaje procedural Tilo:
     * Cerámica marfil, cabeza de caja redondeada, visor negro, dos ojos lima verticales,
     * orejas circulares cobre, antena y cuerpo articulado.
     */
    export function buildCharacter(kind, { mesh, mat, group }) {
      const ceramic = mat(
        new THREE.MeshPhysicalMaterial({
          color: 0xe9e3c7,
          roughness: 0.27,
          metalness: 0.16,
          clearcoat: 1.0,
          clearcoatRoughness: 0.25
        })
      );
      const copper = mat(
        new THREE.MeshPhysicalMaterial({
          color: 0xb4532e,
          roughness: 0.3,
          metalness: 0.7,
          clearcoat: 0.35,
          clearcoatRoughness: 0.28
        })
      );
      const dark = mat(
        new THREE.MeshPhysicalMaterial({
          color: 0x101b1a,
          roughness: 0.16,
          metalness: 0.35,
          clearcoat: 1.0,
          clearcoatRoughness: 0.12
        })
      );
      const trim = mat(
        new THREE.MeshStandardMaterial({
          color: 0x777867,
          roughness: 0.25,
          metalness: 1.0
        })
      );
      const glow = mat(
        new THREE.MeshBasicMaterial({
          color: 0xe4ffb3
        })
      );

      // Grupo de cabeza articulada
      const head = new THREE.Group();
      head.position.y = 0.43;
      group.add(head);

      // Cabeza de caja redondeada en cerámica marfil + bisel y visor negro
      mesh(new RoundedBoxGeometry(2.15, 1.76, 1.5, 5, 0.47), ceramic, head);
      mesh(new RoundedBoxGeometry(1.83, 1.16, 0.28, 5, 0.3), trim, head, [0, -0.04, 0.69]);
      mesh(new RoundedBoxGeometry(1.73, 1.06, 0.35, 5, 0.3), dark, head, [0, -0.04, 0.77]);

      // Dos ojos lima verticales y orejas circulares cobre con tapas de cerámica
      const eyes = [];
      const ears = [];
      const baseEyesX = [-0.43, 0.43];

      for (const x of baseEyesX) {
        const s = Math.sign(x);
        const eye = mesh(new THREE.CapsuleGeometry(0.09, 0.18, 6, 14), glow, head, [x, 0.03, 0.967]);
        eyes.push(eye);

        const earGroup = new THREE.Group();
        earGroup.position.set(s * 1.15, 0, 0);
        head.add(earGroup);
        ears.push(earGroup);

        const earRing = mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.15, 40), copper, earGroup, [0, 0, 0]);
        earRing.rotation.z = Math.PI / 2;

        const earCap = mesh(new THREE.CylinderGeometry(0.255, 0.255, 0.17, 40), ceramic, earGroup, [s * 0.08, 0, 0]);
        earCap.rotation.z = Math.PI / 2;
      }

      // Antena superior con vástago cobre y esfera luminosa lima
      const antennaGroup = new THREE.Group();
      antennaGroup.position.set(0.15, 0.98, 0);
      antennaGroup.rotation.z = -0.2;
      head.add(antennaGroup);
      mesh(new THREE.CapsuleGeometry(0.018, 0.23, 4, 12), copper, antennaGroup, [0, 0, 0]);
      const antennaTip = mesh(new THREE.SphereGeometry(0.07, 24, 16), glow, antennaGroup, [0, 0.15, 0]);

      // Cuello y torso articulado
      mesh(new THREE.CylinderGeometry(0.33, 0.38, 0.38, 36), trim, group, [0, -0.57, 0]);
      mesh(new RoundedBoxGeometry(1.53, 1.2, 0.97, 5, 0.4), ceramic, group, [0, -1.2, 0]);

      // Insignia frontal circular en cobre y núcleo oscuro
      mesh(new THREE.CircleGeometry(0.16, 32), copper, group, [0, -1.05, 0.49]);
      mesh(new THREE.CircleGeometry(0.075, 24), dark, group, [0, -1.05, 0.494]);

      // Brazos articulados con manos esféricas de cobre
      const arms = [];
      for (const s of [-1, 1]) {
        const armPivot = new THREE.Group();
        armPivot.position.set(s * 0.92, -0.9, 0);
        group.add(armPivot);
        arms.push(armPivot);

        const armBody = mesh(new THREE.CapsuleGeometry(0.2, 0.52, 6, 24), ceramic, armPivot, [s * 0.07, -0.23, 0]);
        armBody.rotation.z = s * 0.3;

        mesh(new THREE.SphereGeometry(0.19, 24, 16), copper, armPivot, [s * 0.18, -0.6, 0]);
      }

      group.rotation.y = -0.14;
      group.rotation.z = -0.035;
      group.position.y = 0.25;

      return {
        head,
        update(t, p, gesture) {
          // Seguimiento suave de cabeza con respiración e inclinación de saludo
          const greetWave = gesture > 0 ? Math.sin(gesture * 6.5) : 0;
          const greetEnvelope = gesture > 0 ? Math.sin(Math.min(gesture / 2, 1) * Math.PI) : 0;

          head.rotation.y = p.x * 0.4 + greetWave * 0.08;
          head.rotation.x = -p.y * 0.23 - greetEnvelope * 0.07;
          head.rotation.z = Math.sin(t * 0.7) * 0.025 + greetWave * 0.09;

          // Parpadeo natural y seguimiento ocular
          const blinkCycle = 1 - Math.pow(Math.max(0, Math.cos(t * 1.1)), 60) * 0.92;
          const happySquint = gesture > 0 ? 1 - greetEnvelope * 0.22 : 1;
          const eyeScaleY = blinkCycle * happySquint;

          eyes.forEach((eye, i) => {
            eye.scale.y = eyeScaleY;
            eye.position.x = baseEyesX[i] + p.x * 0.055;
            eye.position.y = 0.03 + p.y * 0.04;
          });

          // Respiración del cuerpo y rebote sutil al saludar
          group.position.y = 0.25 + Math.sin(t * 1.35) * 0.055 + greetEnvelope * 0.07;

          // Micro-movimiento en antena y orejas
          antennaGroup.rotation.z = -0.2 + Math.sin(t * 2.1) * 0.035 + greetWave * 0.14;
          antennaTip.scale.setScalar(1 + greetEnvelope * 0.22);

          ears.forEach((ear, i) => {
            ear.position.y = Math.sin(t * 1.6 + i) * 0.015;
          });

          // Articulación de brazos: respiración en reposo y saludo con el brazo derecho
          if (arms[0]) {
            arms[0].rotation.z = -Math.sin(t * 1.35) * 0.035;
          }
          if (arms[1]) {
            arms[1].rotation.z =
              Math.sin(t * 1.35 + 1) * 0.035 +
              greetEnvelope * 0.58 +
              greetWave * 0.24;
          }
        }
      };
    }

    /**
     * Monta la escena Three.js en #visual / .canvas-mount con RoomEnvironment/PMREM,
     * cámara perspectiva de 35°, luces de estudio y DPR limitado a 1.75 (1.25 móvil).
     */
    export async function mountScene(kind = 'tilo') {
      const hero = document.querySelector('.hero');
      const host = document.querySelector('#visual');
      const mount = (host && host.querySelector('.canvas-mount')) || host;
      const status = document.querySelector('#metrics');
      const actionBtn = document.querySelector('#action');
      const responseEl = document.querySelector('#response');

      if (!host || !mount) return () => {};

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
      } catch (err) {
        if (status) {
          status.textContent = 'WebGL no disponible. Se conserva la composición estática.';
        }
        return () => {};
      }

      const getMaxDpr = () => (window.matchMedia('(max-width: 768px)').matches ? 1.25 : 1.75);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, getMaxDpr()));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0, 0.15, 7.8);
      camera.lookAt(0, 0, 0);

      const group = new THREE.Group();
      scene.add(group);

      const geometries = new Set();
      const materials = new Set();
      const textures = new Set();

      const mesh = (geo, material, parent = group, pos = [0, 0, 0], scale = [1, 1, 1]) => {
        geometries.add(geo);
        const m = new THREE.Mesh(geo, material);
        m.position.set(...pos);
        m.scale.set(...scale);
        parent.add(m);
        return m;
      };

      const mat = (m) => {
        materials.add(m);
        return m;
      };

      // Entorno de estudio con RoomEnvironment y PMREMGenerator
      const pmrem = new THREE.PMREMGenerator(renderer);
      const room = new RoomEnvironment();
      const envTarget = pmrem.fromScene(room, 0.025);
      scene.environment = envTarget.texture;
      scene.environmentIntensity = kind === 'tilo' ? 0.7 : 0.55;
      room.dispose();

      // Luces de estudio
      const hemi = new THREE.HemisphereLight(0xffffff, 0x434137, 0.75);
      scene.add(hemi);

      const key = new THREE.DirectionalLight(0xffebd5, 2.3);
      key.position.set(-3, 5, 5);
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xd4ecff, 1.3);
      fill.position.set(4, 1, 2);
      scene.add(fill);

      const rim = new THREE.DirectionalLight(0xffffff, 3.0);
      rim.position.set(0, 3, -3);
      scene.add(rim);

      // Construcción del personaje Tilo
      const character = buildCharacter(kind, { mesh, mat, group });

      // Sombra radial suave bajo el personaje
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 128;
      shadowCanvas.height = 128;
      const ctx = shadowCanvas.getContext('2d');
      if (ctx) {
        const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(54, 49, 26, 0.22)');
        gradient.addColorStop(1, 'rgba(54, 49, 26, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);
      }
      const shadowTex = new THREE.CanvasTexture(shadowCanvas);
      textures.add(shadowTex);
      const shadowMat = mat(
        new THREE.MeshBasicMaterial({
          map: shadowTex,
          transparent: true,
          depthWrite: false
        })
      );
      const shadow = mesh(new THREE.PlaneGeometry(4, 1), shadowMat, scene, [0, -2.03, -0.5]);
      shadow.rotation.x = -0.2;

      mount.appendChild(renderer.domElement);
      if (hero) hero.classList.add('webgl-ready');

      const pointer = new THREE.Vector2(0, 0);
      const smooth = new THREE.Vector2(0, 0);
      let sayHiTimer = 0;
      let greetingIndex = 0;
      const greetings = [
        'Hola. Ya tienes toda mi atención.',
        '¡Hola! Qué gusto conectar contigo.',
        'Sistemas listos y escuchando.'
      ];

      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let prefersReducedMotion = reducedMotionQuery.matches;
      let inViewport = true;
      let docVisible = !document.hidden;
      let rafId = 0;
      let lastTime = performance.now();
      let elapsed = 0;

      const updateMetrics = () => {
        if (!status) return;
        const dpr = renderer.getPixelRatio().toFixed(2);
        const mode = prefersReducedMotion ? 'estático (reduced-motion)' : inViewport && docVisible ? 'activo' : 'pausado';
        status.textContent = `scene=${kind} · dpr=${dpr} · estado=${mode}`;
      };

      const renderStaticFrame = () => {
        smooth.copy(pointer);
        character.update(elapsed, smooth, sayHiTimer);
        if (prefersReducedMotion && sayHiTimer > 0) {
          character.head.rotation.z = 0.12;
        }
        renderer.render(scene, camera);
        updateMetrics();
      };

      const shouldAnimate = () => !prefersReducedMotion && inViewport && docVisible;

      const tick = (now) => {
        rafId = 0;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        elapsed += dt;

        smooth.lerp(pointer, 0.065);
        character.update(elapsed, smooth, sayHiTimer);

        if (sayHiTimer > 0) {
          sayHiTimer = Math.max(0, sayHiTimer - dt);
        }

        renderer.render(scene, camera);

        if (shouldAnimate()) {
          rafId = requestAnimationFrame(tick);
        }
      };

      const wake = () => {
        updateMetrics();
        if (shouldAnimate()) {
          if (!rafId) {
            lastTime = performance.now();
            rafId = requestAnimationFrame(tick);
          }
        } else {
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          }
          renderStaticFrame();
        }
      };

      const resize = () => {
        const w = Math.max(host.clientWidth, 1);
        const h = Math.max(host.clientHeight, 1);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, getMaxDpr()));
        camera.aspect = w / h;
        // Ajuste sutil de distancia en formatos verticales para conservar al protagonista grande
        const isNarrow = w / h < 0.88;
        camera.position.set(0, isNarrow ? 0.08 : 0.15, isNarrow ? 8.35 : 7.8);
        camera.lookAt(0, isNarrow ? -0.1 : 0, 0);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
        renderStaticFrame();
      };

      const updatePointerFromEvent = (e) => {
        const rect = host.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const ny = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
          pointer.x = Math.max(-1, Math.min(1, nx));
          pointer.y = Math.max(-1, Math.min(1, ny));
        } else {
          pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
          pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }
        if (prefersReducedMotion) renderStaticFrame();
      };

      const onPointerLeave = () => {
        pointer.set(0, 0);
        if (prefersReducedMotion) renderStaticFrame();
      };

      const triggerGreeting = () => {
        sayHiTimer = 2.0;
        if (responseEl) {
          responseEl.textContent = greetings[greetingIndex % greetings.length];
          greetingIndex += 1;
        }
        if (prefersReducedMotion) {
          renderStaticFrame();
        } else {
          wake();
        }
      };

      const onKeyDown = (e) => {
        const step = 0.2;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          pointer.x = Math.max(-1, pointer.x - step);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          pointer.x = Math.min(1, pointer.x + step);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          pointer.y = Math.min(1, pointer.y + step);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          pointer.y = Math.max(-1, pointer.y - step);
        } else if (e.key === 'Home' || e.key === '0') {
          e.preventDefault();
          pointer.set(0, 0);
        } else if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          triggerGreeting();
          return;
        } else {
          return;
        }
        if (prefersReducedMotion) renderStaticFrame();
        else wake();
      };

      const onReducedMotionChange = (e) => {
        prefersReducedMotion = e.matches;
        wake();
      };

      const onVisibilityChange = () => {
        docVisible = !document.hidden;
        wake();
      };

      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            inViewport = entry.isIntersecting;
          }
          wake();
        },
        { threshold: 0.01 }
      );

      if (hero) observer.observe(hero);

      window.addEventListener('pointermove', updatePointerFromEvent, { passive: true });
      host.addEventListener('pointerdown', updatePointerFromEvent, { passive: true });
      window.addEventListener('pointerleave', onPointerLeave, { passive: true });
      host.addEventListener('keydown', onKeyDown);
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', onVisibilityChange);
      if (reducedMotionQuery.addEventListener) {
        reducedMotionQuery.addEventListener('change', onReducedMotionChange);
      }

      if (actionBtn) {
        actionBtn.addEventListener('click', triggerGreeting);
      }

      // Enlaces de cabecera interactivos
      const navExperiencia = document.querySelector('#nav-experiencia');
      if (navExperiencia) {
        navExperiencia.addEventListener('click', (e) => {
          e.preventDefault();
          host.focus({ preventScroll: false });
          if (responseEl && !responseEl.textContent) {
            responseEl.textContent = 'Usa el cursor o las flechas del teclado para mover a Tilo.';
          }
        });
      }

      const navDescubrir = document.querySelector('#nav-descubrir');
      if (navDescubrir) {
        navDescubrir.addEventListener('click', (e) => {
          e.preventDefault();
          if (actionBtn) actionBtn.focus();
          triggerGreeting();
        });
      }

      resize();
      wake();

      return () => {
        if (rafId) cancelAnimationFrame(rafId);
        observer.disconnect();
        window.removeEventListener('pointermove', updatePointerFromEvent);
        host.removeEventListener('pointerdown', updatePointerFromEvent);
        window.removeEventListener('pointerleave', onPointerLeave);
        host.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('resize', resize);
        document.removeEventListener('visibilitychange', onVisibilityChange);
        if (reducedMotionQuery.removeEventListener) {
          reducedMotionQuery.removeEventListener('change', onReducedMotionChange);
        }
        if (actionBtn) {
          actionBtn.removeEventListener('click', triggerGreeting);
        }
        if (renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
        geometries.forEach((g) => g.dispose());
        materials.forEach((m) => m.dispose());
        textures.forEach((t) => t.dispose());
        envTarget.texture.dispose();
        pmrem.dispose();
        renderer.dispose();
      };
    }

    // Tras montar el DOM, iniciamos la escena Tilo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => mountScene('tilo'), { once: true });
    } else {
      mountScene('tilo');
    }
  </script>
</body>
</html>
