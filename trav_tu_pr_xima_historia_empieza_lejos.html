<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trav — Tu próxima historia empieza lejos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background-color: #0b0f14;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .section {
      font-family: 'Inter', sans-serif;
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      isolation: isolate;
      color: #ffffff;
    }

    /* Background video & soft dark overlay */
    .hero-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
      background-color: #0d131a;
    }

    .hero-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        180deg,
        rgba(8, 12, 18, 0.50) 0%,
        rgba(8, 12, 18, 0.36) 48%,
        rgba(8, 12, 18, 0.56) 100%
      );
      pointer-events: none;
    }

    /* Header & Navigation */
    .hero-header {
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 20;
    }

    .brand {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-decoration: none;
      line-height: 1;
      padding: 6px 4px;
      border-radius: 6px;
      transition: opacity 0.2s ease;
    }

    .brand:hover {
      opacity: 0.88;
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 8px 4px;
      border-radius: 6px;
      position: relative;
      transition: color 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 4px;
      height: 1.5px;
      background-color: #ffffff;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.22s ease;
    }

    .nav-link:hover,
    .nav-link[aria-current="page"] {
      color: #ffffff;
    }

    .nav-link:hover::after,
    .nav-link[aria-current="page"]::after {
      transform: scaleX(1);
    }

    /* Accessible Mobile Menu Button */
    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .menu-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .menu-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      position: relative;
    }

    .menu-icon span {
      position: absolute;
      left: 1px;
      right: 1px;
      height: 1.75px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: transform 0.22s ease, opacity 0.2s ease, top 0.22s ease;
    }

    .menu-icon span:nth-child(1) {
      top: 4px;
    }

    .menu-icon span:nth-child(2) {
      top: 8.25px;
    }

    .menu-icon span:nth-child(3) {
      top: 12.5px;
    }

    .menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(1) {
      top: 8.25px;
      transform: rotate(45deg);
    }

    .menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(3) {
      top: 8.25px;
      transform: rotate(-45deg);
    }

    /* Mobile navigation panel */
    .nav-mobile {
      position: absolute;
      top: calc(100% + 10px);
      left: 24px;
      right: 24px;
      background: rgba(12, 17, 24, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 12px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .nav-mobile[data-open="true"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .nav-mobile .nav-link {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 10px;
    }

    .nav-mobile .nav-link::after {
      display: none;
    }

    .nav-mobile .nav-link:hover,
    .nav-mobile .nav-link[aria-current="page"] {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Centered Content */
    .hero-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 48px 24px 64px;
    }

    .hero-content {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .hero-title {
      font-family: 'Inter', sans-serif;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: #ffffff;
      max-width: 16ch;
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    .hero-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.92);
      max-width: 54ch;
      text-wrap: pretty;
      overflow-wrap: break-word;
    }

    .hero-actions {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-download {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      color: #0b0f14;
      background-color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 999px;
      padding: 16px 34px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .btn-download:hover {
      background-color: #f2f4f7;
      transform: translateY(-1px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.36);
    }

    .btn-download:active,
    .btn-download[aria-pressed="true"] {
      transform: translateY(0) scale(0.99);
      background-color: #e6eaf0;
    }

    /* Assistive live region for demonstrative actions */
    .sr-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Visible keyboard focus */
    .brand:focus-visible,
    .nav-link:focus-visible,
    .menu-toggle:focus-visible,
    .btn-download:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    /* Smooth entrance animations */
    @keyframes fadeUpSoft {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      opacity: 0;
      animation: fadeUpSoft 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .delay-1 {
      animation-delay: 0.08s;
    }

    .delay-2 {
      animation-delay: 0.2s;
    }

    .delay-3 {
      animation-delay: 0.32s;
    }

    /* Desktop breakpoint */
    @media (min-width: 768px) {
      .hero-header {
        padding: 32px 48px 0;
      }

      .nav-desktop {
        display: flex;
      }

      .menu-toggle,
      .nav-mobile {
        display: none !important;
      }

      .hero-main {
        padding: 64px 48px 84px;
      }

      .hero-content {
        gap: 24px;
      }

      .hero-title {
        font-size: 60px;
      }

      .hero-subtitle {
        font-size: 19px;
      }
    }

    /* Reduced motion preference: omit animated entrances & transitions */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }

      .animate-in {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="section" id="hero-trav" aria-label="Hero de viajes Trav">
    <!-- Background Video & Soft Dark Layer -->
    <div class="hero-media" aria-hidden="true">
      <video
        id="hero-video"
        class="hero-video"
        src="https://media.dinamosites.com/library/v1/sections/own-portal-loop-d9cbe7d11dd6.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      ></video>
    </div>
    <div class="hero-overlay" aria-hidden="true"></div>

    <!-- Top Navigation Bar -->
    <header class="hero-header">
      <a href="#hero-trav" class="brand" data-nav="Inicio">Trav</a>

      <nav aria-label="Navegación principal">
        <!-- Desktop Links -->
        <ul class="nav-desktop">
          <li><a href="#hero-trav" class="nav-link" aria-current="page" data-nav="Inicio">Inicio</a></li>
          <li><a href="#hero-trav" class="nav-link" data-nav="Nuestra historia">Nuestra historia</a></li>
          <li><a href="#hero-trav" class="nav-link" data-nav="Preguntas">Preguntas</a></li>
          <li><a href="#hero-trav" class="nav-link" data-nav="Políticas">Políticas</a></li>
        </ul>

        <!-- Mobile Menu Button -->
        <button
          type="button"
          id="menu-toggle"
          class="menu-toggle"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Abrir menú de navegación"
        >
          <span>Menú</span>
          <span class="menu-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <!-- Mobile Menu Dropdown -->
        <ul id="mobile-menu" class="nav-mobile" data-open="false" aria-label="Menú móvil">
          <li><a href="#hero-trav" class="nav-link" aria-current="page" data-nav="Inicio">Inicio</a></li>
          <li><a href="#hero-trav" class="nav-link" data-nav="Nuestra historia">Nuestra historia</a></li>
          <li><a href="#hero-trav" class="nav-link" data-nav="Preguntas">Preguntas</a></li>
          <li><a href="#hero-trav" class="nav-link" data-nav="Políticas">Políticas</a></li>
        </ul>
      </nav>
    </header>

    <!-- Centered Hero Copy & CTA -->
    <main class="hero-main">
      <div class="hero-content">
        <h1 class="hero-title animate-in delay-1">Tu próxima historia empieza lejos</h1>
        <p class="hero-subtitle animate-in delay-2">
          Encuentra lugares que no salen en las guías y organiza ese viaje que llevas tiempo imaginando.
        </p>
        <div class="hero-actions animate-in delay-3">
          <button type="button" id="download-btn" class="btn-download" aria-pressed="false">
            <span id="download-label">Descargar</span>
          </button>
        </div>
      </div>
    </main>

    <div id="live-status" class="sr-status" role="status" aria-live="polite"></div>
  </section>

  <script>
    (function () {
      const video = document.getElementById('hero-video');
      const heroSection = document.getElementById('hero-trav');
      const menuToggle = document.getElementById('menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      const navLinks = document.querySelectorAll('.nav-link');
      const brandLink = document.querySelector('.brand');
      const downloadBtn = document.getElementById('download-btn');
      const downloadLabel = document.getElementById('download-label');
      const liveStatus = document.getElementById('live-status');

      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const desktopQuery = window.matchMedia('(min-width: 768px)');
      let isInViewport = true;

      // Handle video playback respecting reduced motion and off-screen pausing
      function syncVideoPlayback() {
        if (!video) return;

        if (reducedMotionQuery.matches) {
          video.pause();
          video.removeAttribute('autoplay');
          return;
        }

        if (isInViewport && !document.hidden) {
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function () {});
          }
        } else {
          video.pause();
        }
      }

      // Freeze on a still frame if reduced motion is active
      if (reducedMotionQuery.matches && video) {
        video.pause();
        video.removeAttribute('autoplay');
        video.addEventListener('loadeddata', function () {
          if (reducedMotionQuery.matches) {
            video.pause();
          }
        }, { once: true });
      }

      if (typeof reducedMotionQuery.addEventListener === 'function') {
        reducedMotionQuery.addEventListener('change', syncVideoPlayback);
      }

      // Pause video when hero is off-screen
      if ('IntersectionObserver' in window && heroSection) {
        const observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              isInViewport = entry.isIntersecting && entry.intersectionRatio > 0.05;
              syncVideoPlayback();
            });
          },
          { threshold: [0, 0.05, 0.25] }
        );
        observer.observe(heroSection);
      }

      document.addEventListener('visibilitychange', syncVideoPlayback);

      // Accessible Mobile Menu
      function setMobileMenuOpen(open) {
        if (!menuToggle || !mobileMenu) return;
        menuToggle.setAttribute('aria-expanded', String(open));
        menuToggle.setAttribute(
          'aria-label',
          open ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'
        );
        mobileMenu.setAttribute('data-open', String(open));
      }

      if (typeof desktopQuery.addEventListener === 'function') {
        desktopQuery.addEventListener('change', function (e) {
          if (e.matches) {
            setMobileMenuOpen(false);
          }
        });
      }

      if (menuToggle && mobileMenu) {
        menuToggle.addEventListener('click', function () {
          const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
          setMobileMenuOpen(!isOpen);
        });

        // Close on Escape and return focus to toggle button
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
            setMobileMenuOpen(false);
            menuToggle.focus();
          }
        });

        // Close when clicking outside the header navigation
        document.addEventListener('click', function (event) {
          if (
            menuToggle.getAttribute('aria-expanded') === 'true' &&
            !mobileMenu.contains(event.target) &&
            !menuToggle.contains(event.target)
          ) {
            setMobileMenuOpen(false);
          }
        });
      }

      // Demonstrative navigation links (update active indicator cleanly without inventing pages/modals)
      function setActiveNav(targetName) {
        navLinks.forEach(function (link) {
          if (link.getAttribute('data-nav') === targetName) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        });
        if (liveStatus) {
          liveStatus.textContent = 'Enlace seleccionado: ' + targetName;
        }
      }

      navLinks.forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          const name = link.getAttribute('data-nav') || link.textContent.trim();
          setActiveNav(name);
          setMobileMenuOpen(false);
        });
      });

      if (brandLink) {
        brandLink.addEventListener('click', function (event) {
          event.preventDefault();
          setActiveNav('Inicio');
          setMobileMenuOpen(false);
        });
      }

      // Demonstrative Download Button (subtle inline confirmation without modals or navigation)
      let downloadResetTimer = null;
      if (downloadBtn && downloadLabel) {
        downloadBtn.addEventListener('click', function () {
          downloadBtn.setAttribute('aria-pressed', 'true');
          downloadLabel.textContent = 'Descargar';
          if (liveStatus) {
            liveStatus.textContent = 'Acción demostrativa: Descargar';
          }
          if (downloadResetTimer) {
            clearTimeout(downloadResetTimer);
          }
          downloadResetTimer = setTimeout(function () {
            downloadBtn.setAttribute('aria-pressed', 'false');
          }, 600);
        });
      }
    })();
  </script>
</body>
</html>
